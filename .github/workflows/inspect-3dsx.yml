name: Inspect 3DSX payload
on:
  push:
    branches: [chatgpt/3ds-next]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Extract embedded RomFS
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libssl-dev libcurl4-openssl-dev
          python3 - <<'PY'
          import struct, pathlib
          p=pathlib.Path('witch_tetris_3ds.3dsx')
          data=p.read_bytes()
          smdh_off,smdh_size,romfs_off=struct.unpack_from('<III',data,32)
          print('size',len(data),'smdh',hex(smdh_off),smdh_size,'romfs',hex(romfs_off),len(data)-romfs_off)
          pathlib.Path('/tmp/romfs.bin').write_bytes(data[romfs_off:])
          PY
          git clone --depth 1 https://github.com/dnasdw/3dstool.git /tmp/3dstool-src
          cmake -S /tmp/3dstool-src -B /tmp/3dstool-build -DUSE_DEP=OFF
          cmake --build /tmp/3dstool-build -j2
          TOOL="$(find /tmp/3dstool-build -type f -name 3dstool | head -1)"
          "$TOOL" -x -t romfs -f /tmp/romfs.bin --romfs-dir /tmp/romfs
          find /tmp/romfs -type f -printf '%P\t%s\n' | sort | tee /tmp/romfs_manifest.txt
          echo "--- likely data/config/script files ---"
          find /tmp/romfs -type f | grep -Ei '\.(json|txt|ini|cfg|lua|py|xml|csv|yaml|yml)$' || true
          echo "--- root ---"
          find /tmp/romfs -maxdepth 2 -type f -printf '%P\n' | sort | head -300
      - name: Upload RomFS manifest
        uses: actions/upload-artifact@v4
        with:
          name: romfs-inspection
          path: /tmp/romfs_manifest.txt
