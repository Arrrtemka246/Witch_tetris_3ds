name: Recover Original 3DS Source
on:
  workflow_dispatch:
  push:
    branches: [chatgpt/recover-original-3ds-source]
    paths:
      - 'reverse3ds/**'
      - '.github/workflows/recover-original-3ds.yml'
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Rebuild ELF from original 3DSX
        run: |
          python3 reverse3ds/recover_3dsx_to_elf.py witch_tetris_3ds.3dsx reverse3ds/Witch_Tetris_original_recovered.elf
          readelf -h reverse3ds/Witch_Tetris_original_recovered.elf
      - name: Download Ghidra
        run: |
          curl -L --fail --retry 3 -o /tmp/ghidra.zip https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip
          echo "93a5d11a9ad510622acaaf908c556a7b9b764d338e78a7567f3689bf5081fd54  /tmp/ghidra.zip" | sha256sum -c -
          unzip -q /tmp/ghidra.zip -d /tmp
      - name: Decompile
        run: |
          mkdir -p /tmp/ghidra-project reverse3ds/output
          /tmp/ghidra_12.1.3_PUBLIC/support/analyzeHeadless /tmp/ghidra-project WitchRecovered \
            -import reverse3ds/Witch_Tetris_original_recovered.elf \
            -overwrite -analysisTimeoutPerFile 900 \
            -scriptPath "$GITHUB_WORKSPACE/reverse3ds/ghidra" \
            -postScript DecompileAll.java "$GITHUB_WORKSPACE/reverse3ds/output/decompiled_all.c" "$GITHUB_WORKSPACE/reverse3ds/output/function_map.tsv"
      - name: Extract useful string clues
        run: |
          strings -a -t x witch_tetris_3ds.3dsx | grep -Ei 'romfs:|matrix|porn|vtd|phobos|pause|tetris|cutscene|winner|room' > reverse3ds/output/string_clues.txt || true
          wc -l reverse3ds/output/decompiled_all.c reverse3ds/output/function_map.tsv reverse3ds/output/string_clues.txt
          grep -Ein 'MATRIX|PORN|VTD|PHOBOS|PAUSE|romfs:' reverse3ds/output/decompiled_all.c | head -300 > reverse3ds/output/key_decompile_hits.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: witch-tetris-original-decompilation
          path: |
            reverse3ds/Witch_Tetris_original_recovered.elf
            reverse3ds/output/decompiled_all.c
            reverse3ds/output/function_map.tsv
            reverse3ds/output/string_clues.txt
            reverse3ds/output/key_decompile_hits.txt
          compression-level: 6
          retention-days: 7
