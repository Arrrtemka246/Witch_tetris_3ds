name: Build Native 3DS Story Test 12

on:
  push:
    branches:
      - chatgpt/3ds-fixes-rc1
    paths:
      - 'native3ds/**'
      - '.github/workflows/build-native-rc2-fast.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: native-3ds-rc2-fast
  cancel-in-progress: true

jobs:
  prepare-lfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Verify original 3DSX
        run: |
          test "$(stat -c%s witch_tetris_3ds.3dsx)" -gt 1000000
          ls -lh witch_tetris_3ds.3dsx
      - uses: actions/upload-artifact@v4
        with:
          name: original-3dsx-current
          path: witch_tetris_3ds.3dsx
          compression-level: 0
          retention-days: 1

  build-native:
    needs: prepare-lfs
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
      options: --user 0
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Download verified original 3DSX
        uses: actions/download-artifact@v4
        with:
          name: original-3dsx-current
          path: .

      - name: Verify original 3DSX
        shell: bash
        run: |
          set -eux
          test "$(stat -c%s witch_tetris_3ds.3dsx)" -gt 1000000
          ls -lh witch_tetris_3ds.3dsx

      - name: Install native build dependencies
        shell: bash
        run: |
          set -eux
          apt-get update
          apt-get install -y curl bzip2 make imagemagick ffmpeg python3-pygame
          test -x "$DEVKITARM/bin/arm-none-eabi-g++"
          test -f "$DEVKITPRO/libctru/lib/libctru.a"
          test -f "$DEVKITPRO/libctru/include/3ds.h"

      - name: Build mpg123 for Nintendo 3DS
        shell: bash
        run: |
          set -eux
          cd /tmp
          curl -L --fail --retry 3 -o mpg123.tar.bz2 https://downloads.sourceforge.net/project/mpg123/mpg123/1.32.3/mpg123-1.32.3.tar.bz2
          tar xf mpg123.tar.bz2
          cd mpg123-1.32.3
          ./configure \
            --host=arm-none-eabi \
            --prefix="$DEVKITPRO/portlibs/3ds" \
            --disable-shared \
            --enable-static \
            --with-cpu=generic_fpu \
            CC="$DEVKITARM/bin/arm-none-eabi-gcc" \
            AR="$DEVKITARM/bin/arm-none-eabi-ar" \
            RANLIB="$DEVKITARM/bin/arm-none-eabi-ranlib" \
            CFLAGS="-O2 -march=armv6k -mtune=mpcore -mfloat-abi=hard -mtp=soft -D_3DS -D__3DS__ -DNO_CATCHSIGNAL"
          make -j"$(nproc)" src/libmpg123/libmpg123.la
          mkdir -p "$DEVKITPRO/portlibs/3ds/lib" "$DEVKITPRO/portlibs/3ds/include"
          LIB="$(find src/libmpg123 -type f -name libmpg123.a | head -n1)"
          HDR="$(find . -type f -name mpg123.h | head -n1)"
          test -n "$LIB"
          test -n "$HDR"
          cp "$LIB" "$DEVKITPRO/portlibs/3ds/lib/libmpg123.a"
          cp "$HDR" "$DEVKITPRO/portlibs/3ds/include/mpg123.h"

      - name: Extract original RomFS assets
        shell: bash
        run: |
          set -eux
          rm -rf native3ds/romfs
          mkdir -p native3ds/romfs
          python3 - <<'PY'
          import struct
          from pathlib import Path
          src=Path("witch_tetris_3ds.3dsx")
          data=src.read_bytes()
          magic,hs,*_=struct.unpack_from("<IHH",data,0)
          assert magic==0x58534433
          fs_off=struct.unpack_from("<I",data,40)[0]
          rom=memoryview(data)[fs_off:]
          hdr_sz,dh_off,dh_sz,dm_off,dm_sz,fh_off,fh_sz,fm_off,fm_sz,fd_off=struct.unpack_from("<10I",rom,0)
          assert hdr_sz==0x28
          NONE=0xffffffff
          def u32(o): return struct.unpack_from("<I",rom,o)[0]
          def u64(o): return struct.unpack_from("<Q",rom,o)[0]
          def name(o,n): return bytes(rom[o:o+n]).decode("utf-16le","replace")
          seen=set(); out=Path("native3ds/romfs")
          def walk(doff,parts):
              if doff==NONE or doff in seen:return
              seen.add(doff); b=dm_off+doff
              parent,sib,sub,fil,nh,nl=struct.unpack_from("<6I",rom,b)
              nm=name(b+0x18,nl); here=parts+([nm] if nm else [])
              f=fil
              while f!=NONE:
                  fb=fm_off+f
                  parent,fsib=struct.unpack_from("<II",rom,fb)
                  off=u64(fb+8); size=u64(fb+16)
                  nh2,nl2=struct.unpack_from("<II",rom,fb+24)
                  fn=name(fb+0x20,nl2)
                  dest=out.joinpath(*here,fn); dest.parent.mkdir(parents=True,exist_ok=True)
                  start=fd_off+off; dest.write_bytes(bytes(rom[start:start+size])); f=fsib
              d=sub
              while d!=NONE:
                  db=dm_off+d; dsib=u32(db+4); walk(d,here); d=dsib
          walk(0,[])
          print("Extracted",sum(1 for p in out.rglob("*") if p.is_file()),"files")
          PY
          test -f native3ds/romfs/gfx/bg_menu.t3x
          test -f native3ds/romfs/audio/menu_1.mp3

      - name: Replace baked playfields with clean castle backgrounds
        shell: bash
        run: |
          set -eux
          convert assets/backgrounds/phase_0_99_throne.png -resize '400x240^' -gravity center -extent 400x240 /tmp/bg_phase0.png
          convert assets/backgrounds/phase_100_199_unstable.png -resize '400x240^' -gravity center -extent 400x240 /tmp/bg_phase1.png
          convert assets/backgrounds/phase_200_plus_liberated.png -resize '400x240^' -gravity center -extent 400x240 /tmp/bg_phase2.png
          tex3ds /tmp/bg_phase0.png -f rgb565 -z auto -o native3ds/romfs/gfx/bg_phase0.t3x
          tex3ds /tmp/bg_phase1.png -f rgb565 -z auto -o native3ds/romfs/gfx/bg_phase1.t3x
          tex3ds /tmp/bg_phase2.png -f rgb565 -z auto -o native3ds/romfs/gfx/bg_phase2.t3x
          test -s native3ds/romfs/gfx/bg_phase0.t3x
          test -s native3ds/romfs/gfx/bg_phase1.t3x
          test -s native3ds/romfs/gfx/bg_phase2.t3x

      - name: Rebuild every rotating cell from the original Python sprites
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -eux
          python3 - <<'PY'
          import json
          from pathlib import Path
          import pygame

          pygame.init()
          pygame.display.set_mode((1, 1))
          kinds = ["I", "O", "T", "S", "Z", "J", "L"]
          meta = json.loads(Path("assets/sprites/phase1/phase1_atlas.json").read_text())
          shapes = meta["shapes"]
          cell = int(meta["cell_size"])
          assert cell == 24

          for family in ("phase1", "horror"):
              output = Path("/tmp") / f"{family}_cells"
              output.mkdir(parents=True, exist_ok=True)
              manifest = ["--atlas -f rgba8888 -z auto"]
              index = 0
              for kind in kinds:
                  for rotation in range(4):
                      coords = shapes[kind][str(rotation)]
                      width = (max(x for x, _ in coords) + 1) * cell
                      height = (max(y for _, y in coords) + 1) * cell
                      source = pygame.image.load(
                          f"assets/sprites/{family}/{kind}_rotation_{rotation * 90}.png"
                      ).convert_alpha()
                      source = pygame.transform.smoothscale(source, (width, height))
                      for x, y in coords:
                          tile = pygame.Surface((cell, cell), pygame.SRCALPHA, 32)
                          tile.blit(source, (0, 0), pygame.Rect(x * cell, y * cell, cell, cell))
                          name = f"{index:03d}.png"
                          pygame.image.save(tile, str(output / name))
                          manifest.append(name)
                          index += 1
              assert index == 112
              (output / "images.t3s").write_text("\n".join(manifest) + "\n")
          pygame.quit()
          PY
          (cd /tmp/phase1_cells && tex3ds -i images.t3s -o "$GITHUB_WORKSPACE/native3ds/romfs/gfx/phase1_cells.t3x")
          (cd /tmp/horror_cells && tex3ds -i images.t3s -o "$GITHUB_WORKSPACE/native3ds/romfs/gfx/horror_cells.t3x")
          test "$(find /tmp/phase1_cells -name '*.png' | wc -l)" -eq 112
          test "$(find /tmp/horror_cells -name '*.png' | wc -l)" -eq 112
          test -s native3ds/romfs/gfx/phase1_cells.t3x
          test -s native3ds/romfs/gfx/horror_cells.t3x

      - name: Add Meridian Control System surprise masks
        shell: bash
        run: |
          set -eux
          tex3ds assets/cutscenes/lines100/heart_kandrakar_mask.png -f rgba8888 -z auto -o native3ds/romfs/gfx/terminal_heart_mask.t3x
          tex3ds assets/cutscenes/lines100/jetix_mask.png -f rgba8888 -z auto -o native3ds/romfs/gfx/terminal_jetix_mask.t3x
          test -s native3ds/romfs/gfx/terminal_heart_mask.t3x
          test -s native3ds/romfs/gfx/terminal_jetix_mask.t3x

      - name: Restore Python voice ownership and Phobos reactions
        shell: bash
        run: |
          set -eux
          encode_voice() { ffmpeg -y -loglevel error -i "$1" -codec:a libmp3lame -b:a 96k "$2"; }
          for n in 1 2 3; do
            encode_voice "assets/audio/voice/guardians/cornelia/earth_${n}.wav" "native3ds/romfs/audio/react_earth_${n}.mp3"
            encode_voice "assets/audio/voice/guardians/irma/water_${n}.wav" "native3ds/romfs/audio/react_water_${n}.mp3"
            encode_voice "assets/audio/voice/guardians/taranee/fire_${n}.wav" "native3ds/romfs/audio/react_fire_${n}.mp3"
            encode_voice "assets/audio/voice/guardians/haylin/air_${n}.wav" "native3ds/romfs/audio/react_air_${n}.mp3"
            encode_voice "assets/audio/sfx/phobos_laughs/laugh_${n}.wav" "native3ds/romfs/audio/react_phobos_tetris_${n}.mp3"
          done
          encode_voice assets/audio/voice/caleb/im_15.wav native3ds/romfs/audio/react_caleb_clear.mp3
          blunk_one=(businessman laugh groan fight)
          for i in 0 1 2 3; do encode_voice "assets/audio/voice/blunk/${blunk_one[$i]}.wav" "native3ds/romfs/audio/react_blunk_one_$((i+1)).mp3"; done
          blunk_two=(also_warrior treasure not_afraid)
          for i in 0 1 2; do encode_voice "assets/audio/voice/blunk/${blunk_two[$i]}.wav" "native3ds/romfs/audio/react_blunk_two_$((i+1)).mp3"; done
          encode_voice assets/audio/voice/phobos/meridian_mine.mp3 native3ds/romfs/audio/react_phobos_start_0.mp3
          encode_voice assets/audio/voice/phobos/dark_side.mp3 native3ds/romfs/audio/react_phobos_start_1.mp3
          encode_voice assets/audio/voice/phobos/extra/lets_begin.wav native3ds/romfs/audio/react_phobos_start_2.mp3
          encode_voice assets/audio/voice/phobos/extra2/your_power_is_nothing.wav native3ds/romfs/audio/react_phobos_start_3.mp3
          encode_voice assets/audio/voice/phobos/extra2/last_hope_universe.wav native3ds/romfs/audio/react_phobos_start_4.mp3
          encode_voice assets/audio/voice/phobos/extra2/new_era_phobos.wav native3ds/romfs/audio/react_phobos_start_5.mp3
          encode_voice assets/audio/voice/phobos/extra2/destroy_weak_link.wav native3ds/romfs/audio/react_destroy_weak.mp3
          encode_voice assets/audio/voice/phobos/rotate_hint.mp3 native3ds/romfs/audio/react_phobos_rotate_hint.mp3
          encode_voice assets/audio/voice/phobos/hold_hint.mp3 native3ds/romfs/audio/react_phobos_hold_hint.mp3
          pause_sources=(extra/well.wav extra2/no_need_to_hurry.wav extra2/waiting_achieves.wav extra2/whats_wrong_short.wav extra2/whats_wrong_full.wav extra2/what_do_you_want.wav)
          for i in 0 1 2 3 4 5; do encode_voice "assets/audio/voice/phobos/${pause_sources[$i]}" "native3ds/romfs/audio/react_phobos_pause_${i}.mp3"; done
          encode_voice assets/audio/voice/phobos/not_bad.mp3 native3ds/romfs/audio/react_tetris_not_bad.mp3
          encode_voice assets/audio/voice/phobos/pause_hint.mp3 native3ds/romfs/audio/react_phobos_pause_hint.mp3
          encode_voice assets/audio/voice/phobos/layout_wont_help.mp3 native3ds/romfs/audio/react_phobos_layout.mp3
          encode_voice assets/audio/voice/phobos/blunk_angry.mp3 native3ds/romfs/audio/react_phobos_blunk_angry.mp3
          encode_voice assets/audio/voice/phobos/blunk_annoyed.mp3 native3ds/romfs/audio/react_phobos_blunk_annoyed.mp3
          encode_voice assets/audio/voice/phobos/rebel.mp3 native3ds/romfs/audio/react_phobos_caleb_rebel.mp3
          encode_voice assets/audio/voice/phobos/crystal.mp3 native3ds/romfs/audio/react_phobos_crystal.mp3
          encode_voice assets/audio/voice/phobos/guardian_of_veil.mp3 native3ds/romfs/audio/react_phobos_guardian.mp3
          encode_voice assets/audio/voice/phobos/extra/name_traitors.wav native3ds/romfs/audio/react_phobos_name_traitors.mp3
          encode_voice assets/audio/voice/phobos/extra2/need_crystal.wav native3ds/romfs/audio/react_phobos_need_crystal.mp3
          encode_voice assets/audio/voice/phobos/extra2/well_girls.wav native3ds/romfs/audio/react_phobos_well_girls.mp3
          encode_voice assets/audio/voice/phobos/extra2/expected_no_less.wav native3ds/romfs/audio/react_phobos_expected_no_less.mp3
          encode_voice assets/audio/voice/phobos/extra2/you_loser.wav native3ds/romfs/audio/react_phobos_you_loser.mp3
          test -s native3ds/romfs/audio/react_earth_3.mp3
          test -s native3ds/romfs/audio/react_blunk_two_3.mp3
          test -s native3ds/romfs/audio/react_phobos_start_5.mp3
          test -s native3ds/romfs/audio/react_phobos_rotate_hint.mp3
          test -s native3ds/romfs/audio/react_phobos_hold_hint.mp3
          test -s native3ds/romfs/audio/react_phobos_pause_5.mp3

      - name: Restore the original Python phase music
        shell: bash
        run: |
          set -eux
          encode_music() { ffmpeg -y -loglevel error -i "$1" -codec:a libmp3lame -b:a 112k "$2"; }
          rm -f native3ds/romfs/audio/music_arcade_*.mp3 native3ds/romfs/audio/music_bonus_*.mp3 native3ds/romfs/audio/music_football_*.mp3 native3ds/romfs/audio/music_washing_*.mp3
          encode_music assets/audio/music/phase_0_99_phobos/Arrogant_Prince_of_the_Obsidian_Court.mp3 native3ds/romfs/audio/music_p0_opening.mp3
          phase0=(Phase1_sm.mp3 crusified2.mp3 football_1.mp3 football_2.mp3 gothic_puzzle_quest.mp3 phase1.mp3 phase1_dop.mp3 phase1_dop2.mp3 phase1_numberone.mp3 phase1_po.mp3 phase1_po2.mp3)
          for i in "${!phase0[@]}"; do printf -v out 'native3ds/romfs/audio/music_p0_%02d.mp3' "$i"; encode_music "assets/audio/user_music/phase1/${phase0[$i]}" "$out"; done
          phase1=(Phase2_e.mp3 Phase2_sm.mp3 crucified.mp3 phase2.mp3 phase2_1.mp3 phase2_2.mp3 phase2_3.mp3 phase2_final_countdown.mp3 phase2_force.mp3 phase2_force2.mp3 phase2_h.mp3 phase2_sw.mp3 phase2_sw1.mp3 phobos_empty_hollow_1.mp3)
          for i in "${!phase1[@]}"; do printf -v out 'native3ds/romfs/audio/music_p1_%02d.mp3' "$i"; encode_music "assets/audio/user_music/phase2/${phase1[$i]}" "$out"; done
          guardians=(calebrun.mp3 witch_ending.mp3 witchending.mp3 witchending2.mp3 witchending_and_arcade.mp3)
          for i in "${!guardians[@]}"; do printf -v out 'native3ds/romfs/audio/music_guardians_%02d.mp3' "$i"; encode_music "assets/audio/user_music/guardians/${guardians[$i]}" "$out"; done
          encode_music assets/audio/music/phobos_route/Phobos_main_theme_3_phase.mp3 native3ds/romfs/audio/music_phobos_opening.mp3
          phobos=(Theme.mp3 football_2.mp3 phase3.mp3 phobos3_1.mp3 phobos3_2.mp3)
          for i in "${!phobos[@]}"; do printf -v out 'native3ds/romfs/audio/music_phobos_%02d.mp3' "$i"; encode_music "assets/audio/user_music/phobos/${phobos[$i]}" "$out"; done
          test -s native3ds/romfs/audio/music_p0_10.mp3
          test -s native3ds/romfs/audio/music_p1_13.mp3
          test -s native3ds/romfs/audio/music_guardians_04.mp3
          test -s native3ds/romfs/audio/music_phobos_04.mp3

      - name: Add PORN-code gallery cards
        shell: bash
        run: |
          set -eux
          convert "assets/secrets/porn/W.I.T.C.H._S01E12_%2816%29.webp" -resize '512x256>' /tmp/secret_porn0.png
          convert "assets/secrets/porn/sddefault.jpg" -resize '512x256>' /tmp/secret_porn1.png
          tex3ds /tmp/secret_porn0.png -f rgba8888 -z auto -o native3ds/romfs/gfx/secret_porn0.t3x
          tex3ds /tmp/secret_porn1.png -f rgba8888 -z auto -o native3ds/romfs/gfx/secret_porn1.t3x
          test -s native3ds/romfs/gfx/secret_porn0.t3x
          test -s native3ds/romfs/gfx/secret_porn1.t3x

      - name: Add offline logo cards
        shell: bash
        run: |
          set -eux
          curl -L --fail --retry 3 -o /tmp/chatgpt.ico https://chatgpt.com/favicon.ico || true
          curl -L --fail --retry 3 -o /tmp/suno.ico https://suno.com/favicon.ico || true
          if identify /tmp/chatgpt.ico >/dev/null 2>&1; then
            convert '/tmp/chatgpt.ico[0]' -resize '192x192' /tmp/chatgpt.png
          else
            convert -size 192x192 xc:'#111b1d' /tmp/chatgpt.png
          fi
          if identify /tmp/suno.ico >/dev/null 2>&1; then
            convert '/tmp/suno.ico[0]' -resize '192x192' /tmp/suno.png
          else
            convert -size 192x192 xc:'#6b3df0' /tmp/suno.png
          fi
          tex3ds /tmp/chatgpt.png -f rgba8888 -z auto -o native3ds/romfs/gfx/logo_chatgpt.t3x
          tex3ds /tmp/suno.png -f rgba8888 -z auto -o native3ds/romfs/gfx/logo_suno.t3x

      - name: Prepare native secret videos
        shell: bash
        run: |
          set -eux
          mkdir -p native3ds/romfs/video/matrix native3ds/romfs/video/porn
          ffmpeg -y -loglevel error -i assets/secrets/videos/prepared/matrix/audio.wav -codec:a libmp3lame -b:a 96k native3ds/romfs/video/matrix.mp3
          ffmpeg -y -loglevel error -i assets/secrets/videos/prepared/porn/audio.wav -codec:a libmp3lame -b:a 96k native3ds/romfs/video/porn.mp3
          matrix_index=0
          for frame in assets/secrets/videos/prepared/matrix/frames/*.jpg; do
            source_index="$(basename "$frame" .jpg)"
            if (( (10#$source_index - 1) % 2 != 0 )); then continue; fi
            convert "$frame" -resize '400x240^' -gravity center -extent 400x240 /tmp/video_frame.png
            printf -v output 'native3ds/romfs/video/matrix/matrix_%03d.t3x' "$matrix_index"
            tex3ds /tmp/video_frame.png -f rgb565 -z auto -o "$output"
            matrix_index=$((matrix_index + 1))
          done
          porn_index=0
          for frame in assets/secrets/videos/prepared/porn/frames/*.jpg; do
            convert "$frame" -resize '400x240^' -gravity center -extent 400x240 /tmp/video_frame.png
            printf -v output 'native3ds/romfs/video/porn/porn_%03d.t3x' "$porn_index"
            tex3ds /tmp/video_frame.png -f rgb565 -z auto -o "$output"
            porn_index=$((porn_index + 1))
          done
          test "$matrix_index" -eq 214
          test "$porn_index" -eq 35
          test -s native3ds/romfs/video/matrix.mp3
          test -s native3ds/romfs/video/porn.mp3

      - name: Prepare Guardians ending cartoon and route voices
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -eux
          mkdir -p /tmp/ending_frames native3ds/romfs/video/ending
          python3 - <<'PY'
          from pathlib import Path
          import pygame
          from ending import Ending

          pygame.init()
          pygame.display.set_mode((1, 1))
          ending = Ending()
          dummy = pygame.Surface((16, 16))
          output = Path("/tmp/ending_frames")
          fps = 15
          count = 430
          for index in range(count):
              ending.draw(dummy, t=index / fps)
              frame = pygame.transform.smoothscale(ending.stage, (400, 225))
              canvas = pygame.Surface((400, 240))
              canvas.fill((0, 0, 0))
              canvas.blit(frame, (0, 7))
              pygame.image.save(canvas, str(output / f"ending_{index:03d}.png"))
          pygame.quit()
          PY
          ending_index=0
          for frame in /tmp/ending_frames/ending_*.png; do
            printf -v output 'native3ds/romfs/video/ending/ending_%03d.t3x' "$ending_index"
            tex3ds "$frame" -f rgb565 -z auto -o "$output"
            ending_index=$((ending_index + 1))
          done
          test "$ending_index" -eq 430
          ffmpeg -y -loglevel error -i assets/audio/music/ending/witch_end_outro.mp3 -codec:a libmp3lame -b:a 96k native3ds/romfs/video/ending.mp3
          ffmpeg -y -loglevel error -i assets/audio/voice/route_story/guardians/will_reverse.wav -codec:a libmp3lame -b:a 96k native3ds/romfs/audio/will_reverse.mp3
          ffmpeg -y -loglevel error -i assets/audio/voice/route_story/phobos/phobos_r.wav -codec:a libmp3lame -b:a 96k native3ds/romfs/audio/phobos_reverse.mp3
          test -s native3ds/romfs/video/ending/ending_429.t3x
          test -s native3ds/romfs/video/ending.mp3
          test -s native3ds/romfs/audio/will_reverse.mp3
          test -s native3ds/romfs/audio/phobos_reverse.mp3

      - name: Build 3DSX
        shell: bash
        run: |
          set -eux
          cp witch_tetris_3ds.smdh native3ds/witch_tetris_3ds_rc2.smdh
          cd native3ds
          make -j"$(nproc)"
          cp witch_tetris_3ds_rc2.3dsx WITCH_Tetris_3DS_Story_Test_12.3dsx
          ls -lh witch_tetris_3ds_rc2.3dsx
          test -s witch_tetris_3ds_rc2.3dsx

      - name: Upload native RC2
        uses: actions/upload-artifact@v4
        with:
          name: witch-tetris-3ds-story-test-12-native
          path: |
            native3ds/WITCH_Tetris_3DS_Story_Test_12.3dsx
            native3ds/witch_tetris_3ds_rc2.map
            native3ds/source/main.cpp
            witch_tetris_3ds.smdh
          compression-level: 0
          retention-days: 7

  package-cia:
    needs: build-native
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download native RC2
        uses: actions/download-artifact@v4
        with:
          name: witch-tetris-3ds-story-test-12-native
          path: package

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake build-essential libtool curl unzip

      - name: Build cxitool
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch cxi-stuff https://github.com/devkitPro/3dstools.git /tmp/3dstools
          cd /tmp/3dstools
          ./autogen.sh
          ./configure
          make -j"$(nproc)" cxitool
          cp cxitool "$GITHUB_WORKSPACE/cxitool"

      - name: Install makerom
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -o /tmp/makerom.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip
          unzip -q /tmp/makerom.zip -d /tmp/makerom
          find /tmp/makerom -type f -name makerom -exec cp {} "$GITHUB_WORKSPACE/makerom" \;
          chmod +x "$GITHUB_WORKSPACE/makerom"

      - name: Package CIA
        shell: bash
        run: |
          set -euxo pipefail
          find package -maxdepth 4 -type f -ls
          DSX="$(find package -type f -name WITCH_Tetris_3DS_Story_Test_12.3dsx | head -1)"
          SMDH="$(find package -type f -name witch_tetris_3ds.smdh | head -1)"
          test -n "$DSX"
          test -n "$SMDH"
          ./cxitool -n WTetris -c CTR-H-WTTR -t 000400000FCA3D00 "$DSX" witch_tetris_3ds_rc3.cxi
          ./makerom -f cia -o WITCH_Tetris_3DS_Story_Test_12.cia -target t -i witch_tetris_3ds_rc3.cxi:0:0 -ignoresign -icon "$SMDH"
          sha256sum WITCH_Tetris_3DS_Story_Test_12.cia | tee WITCH_Tetris_3DS_Story_Test_12.cia.sha256
          ls -lh WITCH_Tetris_3DS_Story_Test_12.cia

      - name: Upload final RC2
        uses: actions/upload-artifact@v4
        with:
          name: witch-tetris-3ds-story-test-12-final
          path: |
            WITCH_Tetris_3DS_Story_Test_12.cia
            WITCH_Tetris_3DS_Story_Test_12.cia.sha256
          compression-level: 0
          retention-days: 7
